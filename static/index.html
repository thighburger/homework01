<!doctype html>
<html>

<head>
  <meta charset="utf-8">
  <title>스팸 판별기</title>
</head>

<body>
  <h1>스팸 판별기</h1>
  <textarea id="text" rows="5" cols="60" placeholder="메시지를 입력하세요"></textarea><br><br>
  <button onclick="classify()">스팸 탐지</button>
      <h3 id="result"></h3>
      <pre id="model-info"></pre>
  <script>
    function classify() {
      const text = document.getElementById("text").value;
      const result = document.getElementById("result");

      if (!text) {
        result.innerText = "메시지를 입력해주세요.";
        document.getElementById("model-info").innerText = "";
        return;
      }

      fetch("/classify", {
        method: "POST",
        headers: {
          "Content-Type": "application/json"
        },
        body: JSON.stringify({ text })
      })
        .then(res => {
          if (!res.ok) {
            throw new Error("request failed");
          }
          return res.json();
        })
        .then(data => {
          result.innerText = "결과: " + data.label + " (score=" + data.score + ")";
          let info = "";
          if (data.model_info) {
            info += "모델: " + data.model_info.model_type + "\n";
            info += "Test Acc: " + data.model_info.test_accuracy + "\n";
            info += "Run ID: " + data.model_info.run_id;
          }
          document.getElementById("model-info").innerText = info;
        })
        .catch(() => {
          result.innerText = "에러 발생";
          document.getElementById("model-info").innerText = "";
        });
    }
  </script>
</body>

</html>
